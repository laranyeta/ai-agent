services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your .env}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OFFERS_FILE: /app/docs/jobs.xlsx
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      chroma:
        condition: service_started

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/data
    expose:
      - "8000"

volumes:
  chroma_data:
